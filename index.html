<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI 对话助手</title>
<style>
  /* ── 字体 ─────────────────────────────── */
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  /* ── 主题变量 ──────────────────────────── */
  :root {
    --bg:          #0d0f14;
    --surface:     #161920;
    --surface2:    #1e2230;
    --border:      #2a2f3e;
    --accent:      #4f8ef7;
    --accent-dim:  #2d4f8a;
    --text:        #e8eaf0;
    --text-dim:    #8891a8;
    --user-bg:     #1a2540;
    --ai-bg:       #161920;
    --danger:      #e05c6a;
    --success:     #4caf82;
    --radius:      14px;
    --font:        'Noto Sans SC', sans-serif;
  }

  /* ── 全局重置 ──────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 整体布局 ──────────────────────────── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 760px;
    margin: 0 auto;
  }

  /* ── 顶栏 ──────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 10px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #7c5cfc);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }

  .header-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .header-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  .clear-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--font);
    transition: all .2s;
    flex-shrink: 0;
  }

  .clear-btn:hover, .clear-btn:active {
    border-color: var(--danger);
    color: var(--danger);
  }

  /* ── 消息区域 ──────────────────────────── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── 欢迎屏 ──────────────────────────── */
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 14px;
    padding: 40px 20px;
    text-align: center;
    animation: fadeIn .6s ease;
  }

  #welcome .big-icon {
    font-size: 52px;
    filter: drop-shadow(0 0 24px rgba(79,142,247,0.4));
  }

  #welcome h2 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }

  #welcome p {
    font-size: 14px;
    color: var(--text-dim);
    max-width: 280px;
    line-height: 1.6;
  }

  .suggestion-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 6px;
  }

  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-family: var(--font);
    transition: all .2s;
  }

  .chip:hover, .chip:active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(79,142,247,0.08);
  }

  /* ── 消息气泡 ──────────────────────────── */
  .msg {
    display: flex;
    gap: 10px;
    animation: slideUp .25s ease;
    max-width: 100%;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg.user .avatar {
    background: linear-gradient(135deg, #2d5ba0, var(--accent));
  }

  .msg.ai .avatar {
    background: linear-gradient(135deg, #3d2f7a, #7c5cfc);
  }

  .bubble {
    max-width: calc(100% - 52px);
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.75;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid var(--accent-dim);
    border-top-right-radius: 4px;
    color: var(--text);
  }

  .msg.ai .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--text);
  }

  /* 打字光标 */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink .7s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  /* ── 统计条 ──────────────────────────── */
  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    padding: 8px 15px 10px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-dim);
  }

  .stat-item { display: flex; align-items: center; gap: 4px; }
  .stat-item span { color: var(--accent); font-weight: 600; }

  /* ── 输入区 ──────────────────────────── */
  #input-area {
    padding: 12px 14px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px 8px 14px;
    transition: border-color .2s;
  }

  .input-row:focus-within {
    border-color: var(--accent);
  }

  #user-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 14.5px;
    line-height: 1.6;
    resize: none;
    max-height: 120px;
    min-height: 24px;
    overflow-y: auto;
  }

  #user-input::placeholder { color: var(--text-dim); }

  #send-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all .15s;
    margin-bottom: 2px;
  }

  #send-btn:hover { background: #3a7ae8; transform: scale(1.05); }
  #send-btn:active { transform: scale(0.96); }
  #send-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

  #send-btn svg { width: 17px; height: 17px; fill: white; }

  .hint-text {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    opacity: 0.6;
  }

  /* ── 错误消息 ──────────────────────────── */
  .error-bubble {
    background: rgba(224,92,106,0.1);
    border: 1px solid rgba(224,92,106,0.3);
    color: #e88a93;
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 13.5px;
    animation: slideUp .25s ease;
  }

  /* ── 思考动画 ──────────────────────────── */
  .thinking {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 4px 0;
  }

  .thinking-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce .8s infinite;
  }

  .thinking-dot:nth-child(2) { animation-delay: .15s; }
  .thinking-dot:nth-child(3) { animation-delay: .3s; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: .4; }
    50%       { transform: translateY(-5px); opacity: 1; }
  }

  /* ── 移动端适配 ──────────────────────────── */
  @media (max-width: 480px) {
    header { padding: 12px 14px; }
    #messages { padding: 14px 12px; gap: 14px; }
    .bubble { font-size: 14px; padding: 10px 13px; }
    .stats-bar { font-size: 11px; }
    #input-area { padding: 10px 12px 14px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- 顶栏 -->
  <header>
    <div class="header-left">
      <div class="logo">🤖</div>
      <div>
        <div class="header-title">AI 对话助手</div>
        <div class="header-sub">DeepSeek · 流式输出</div>
      </div>
    </div>
    <div class="header-left" style="gap:12px">
      <div class="status-dot" id="status-dot"></div>
      <button class="clear-btn" onclick="clearHistory()">清空记录</button>
    </div>
  </header>

  <!-- 消息列表 -->
  <div id="messages">
    <div id="welcome">
      <div class="big-icon">✨</div>
      <h2>你好，有什么可以帮你？</h2>
      <p>基于 DeepSeek 大模型，支持流式输出，回答实时逐字显示</p>
      <div class="suggestion-chips">
        <button class="chip" onclick="sendChip(this)">介绍一下你自己</button>
        <button class="chip" onclick="sendChip(this)">帮我写一首诗</button>
        <button class="chip" onclick="sendChip(this)">今天适合做什么</button>
        <button class="chip" onclick="sendChip(this)">推荐一部好电影</button>
      </div>
    </div>
  </div>

  <!-- 统计栏（隐藏，回复后显示） -->
  <div class="stats-bar" id="stats-bar" style="display:none">
    <div class="stat-item">📥 输入 <span id="s-in">-</span> tokens</div>
    <div class="stat-item">📤 输出 <span id="s-out">-</span> tokens</div>
    <div class="stat-item">⏱ 思考 <span id="s-think">-</span> ms</div>
    <div class="stat-item">🔄 渲染 <span id="s-stream">-</span> ms</div>
  </div>

  <!-- 输入区 -->
  <div id="input-area">
    <div class="input-row">
      <textarea
        id="user-input"
        placeholder="输入消息，Enter 发送，Shift+Enter 换行"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" title="发送">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="hint-text">由 DeepSeek 提供支持 · 对话记录仅保存在本设备</div>
  </div>

</div>

<script>
// ── 状态 ─────────────────────────────────
let history    = JSON.parse(localStorage.getItem('chat_history') || '[]');
let isStreaming = false;
let sendTime   = 0;
let firstTokenTime = 0;

// ── 工具函数 ─────────────────────────────
function $(id) { return document.getElementById(id); }

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function scrollBottom() {
  const el = $('messages');
  el.scrollTop = el.scrollHeight;
}

function hideWelcome() {
  const w = $('welcome');
  if (w) w.remove();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendChip(btn) {
  $('user-input').value = btn.textContent;
  sendMessage();
}

// ── 渲染消息 ─────────────────────────────
function appendMsg(role, text, id) {
  hideWelcome();
  const wrap = $('messages');

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (id) div.id = id;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '👤' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  div.appendChild(avatar);
  div.appendChild(bubble);
  wrap.appendChild(div);
  scrollBottom();
  return bubble;
}

function appendError(msg) {
  hideWelcome();
  const wrap = $('messages');
  const div = document.createElement('div');
  div.className = 'error-bubble';
  div.textContent = '⚠️ ' + msg;
  wrap.appendChild(div);
  scrollBottom();
}

function showThinking() {
  hideWelcome();
  const wrap = $('messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'thinking-indicator';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = `<div class="thinking">
    <div class="thinking-dot"></div>
    <div class="thinking-dot"></div>
    <div class="thinking-dot"></div>
  </div>`;

  div.appendChild(avatar);
  div.appendChild(bubble);
  wrap.appendChild(div);
  scrollBottom();
}

function removeThinking() {
  const el = $('thinking-indicator');
  if (el) el.remove();
}

// ── 发送消息 ─────────────────────────────
async function sendMessage() {
  if (isStreaming) return;

  const input = $('user-input');
  const text  = input.value.trim();
  if (!text) return;

  // 清空输入框
  input.value = '';
  input.style.height = 'auto';
  $('send-btn').disabled = true;
  isStreaming = true;

  // 更新状态指示灯
  $('status-dot').style.background = '#f0a040';
  $('stats-bar').style.display = 'none';

  // 显示用户消息
  appendMsg('user', text);

  // 加入历史
  history.push({ role: 'user', content: text });

  // 显示思考动画
  showThinking();
  sendTime = Date.now();
  firstTokenTime = 0;

  try {
    const resp = await fetch('/api/chat', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ messages: history })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: `HTTP ${resp.status}` }));
      removeThinking();
      appendError(err.error || '请求失败，请稍后重试');
      history.pop();
      return;
    }

    // ── SSE 流式读取 ──────────────────────
    removeThinking();
    const aiBubble = appendMsg('ai', '');

    // 添加光标
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    aiBubble.appendChild(cursor);

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let   fullReply = '';
    let   buffer    = '';
    let   streamStartTime = 0;

    // Token 统计
    let tokIn = 0, tokOut = 0, tokTotal = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // 保留未完整的行

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data:')) continue;

        const dataStr = trimmed.slice(5).trim();
        if (dataStr === '[DONE]') continue;

        try {
          const chunk = JSON.parse(dataStr);

          // 提取文本
          const piece = chunk?.choices?.[0]?.delta?.content || '';
          if (piece) {
            // 记录首token时间
            if (firstTokenTime === 0) {
              firstTokenTime = Date.now();
              streamStartTime = firstTokenTime;
            }

            fullReply += piece;
            // 在光标前插入文字
            aiBubble.insertBefore(
              document.createTextNode(piece),
              cursor
            );
            scrollBottom();
          }

          // 提取 token 统计
          const usage = chunk?.usage;
          if (usage) {
            tokIn    = usage.prompt_tokens     || 0;
            tokOut   = usage.completion_tokens || 0;
            tokTotal = usage.total_tokens      || 0;
          }

        } catch (e) { /* 忽略解析异常 */ }
      }
    }

    // 移除光标
    cursor.remove();

    // 更新历史
    if (fullReply) {
      history.push({ role: 'assistant', content: fullReply });
      localStorage.setItem('chat_history', JSON.stringify(history));
    }

    // 更新统计栏
    const thinkMs  = firstTokenTime ? firstTokenTime - sendTime : 0;
    const streamMs = firstTokenTime ? Date.now() - firstTokenTime : 0;

    $('s-in').textContent    = tokIn.toLocaleString();
    $('s-out').textContent   = tokOut.toLocaleString();
    $('s-think').textContent  = thinkMs.toLocaleString();
    $('s-stream').textContent = streamMs.toLocaleString();
    $('stats-bar').style.display = 'flex';

  } catch (e) {
    removeThinking();
    appendError('网络异常，请检查连接后重试');
    history.pop();
  } finally {
    isStreaming = false;
    $('send-btn').disabled = false;
    $('status-dot').style.background = '#4caf82';
    $('user-input').focus();
  }
}

// ── 清空历史 ─────────────────────────────
function clearHistory() {
  if (!confirm('确定要清空所有对话记录吗？')) return;
  history = [];
  localStorage.removeItem('chat_history');
  $('messages').innerHTML = '';
  $('stats-bar').style.display = 'none';

  // 重新显示欢迎屏
  const welcome = document.createElement('div');
  welcome.id = 'welcome';
  welcome.innerHTML = `
    <div class="big-icon">✨</div>
    <h2>你好，有什么可以帮你？</h2>
    <p>基于 DeepSeek 大模型，支持流式输出，回答实时逐字显示</p>
    <div class="suggestion-chips">
      <button class="chip" onclick="sendChip(this)">介绍一下你自己</button>
      <button class="chip" onclick="sendChip(this)">帮我写一首诗</button>
      <button class="chip" onclick="sendChip(this)">今天适合做什么</button>
      <button class="chip" onclick="sendChip(this)">推荐一部好电影</button>
    </div>`;
  $('messages').appendChild(welcome);
}

// ── 恢复历史记录 ─────────────────────────
function restoreHistory() {
  if (history.length === 0) return;
  hideWelcome();
  for (const msg of history) {
    appendMsg(msg.role, msg.content);
  }
}

// ── 初始化 ───────────────────────────────
restoreHistory();
$('user-input').focus();
</script>
</body>
</html>
